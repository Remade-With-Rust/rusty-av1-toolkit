[workspace]
members = [".", "tools"]
default-members = [".", "tools"]

[package]
name = "rusty_av1d"
authors = ["Rav1d Developers", "Prossimo"]
version = "1.1.0"
edition = "2021"
rust-version = "1.79"
description = "Remade With Rust fork of rav1d (Rust port of the dav1d AV1 decoder) with a pure-Rust no-asm build path"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/Remade-With-Rust/rusty-av1-toolkit"
keywords = ["av1", "video", "decoder", "codec", "dav1d"]
categories = ["multimedia::video", "multimedia::encoding"]
exclude = ["*.c", "*.h", "*.in", "meson*", "tests/", "doc/", "docs/", "package/"]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
assert_matches = "1.5.0"
atomig = { version = "0.4.0", features = ["derive"] }
av-data = "0.4.2"
bitflags = "2.4.0"
cfg-if = "1.0.0"
parking_lot = "0.12.2"
paste = "1.0.14"
raw-cpuid = "11.0.1"
static_assertions = "1.1.0"
strum = { version = "0.27", features = ["derive"] }
to_method = "1.1.0"
zerocopy = { version = "0.7.32", features = ["derive"] }

[build-dependencies]
cc = "1.0.79"
nasm-rs = { version = "0.3", features = ["parallel"], optional = true }

[features]
default = ["asm", "asm_arm64_dotprod", "asm_arm64_i8mm", "asm_arm64_sve2", "bitdepth_8", "bitdepth_16"]
asm = ["dep:nasm-rs"]
asm_arm64_dotprod = ["asm"]
asm_arm64_i8mm = ["asm"]
asm_arm64_sve2 = ["asm"]
bitdepth_8 = []
bitdepth_16 = []
# analyzer spine: feature-gated stage profiler (src/prof.rs). OFF = byte-identical
# decode (md5 unchanged); ON times rdtsc cycle buckets per decode stage.
profile = []

[profile.dev]
panic = "abort"

[profile.opt-dev]
# The debug builds run tests very slowly so this profile keeps debug assertions
# while enabling basic optimizations. The profile is not suitable for debugging.
inherits = "dev"
opt-level = 1

[profile.release]
codegen-units = 1
panic = "abort"
lto = "fat"

[profile.release-with-debug]
inherits = "release"
debug = "line-tables-only"

[profile.checked-release]
# Close to a release build, but with all checks enabled.
inherits = "dev"
opt-level = 2
codegen-units = 16

[dev-dependencies]
libc = "0.2"
